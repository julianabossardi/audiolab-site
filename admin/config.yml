backend:
  name: github
  repo: julianabossardi/audiolab-site
  branch: main
  # o GitHub não permite login direto do navegador; quem faz a troca do
  # código de autorização pelo token são as funções em api/auth.js e
  # api/callback.js, publicadas junto com o resto do site na Vercel.
  # Precisam de um app OAuth do GitHub e das variáveis de ambiente
  # OAUTH_CLIENT_ID e OAUTH_CLIENT_SECRET configuradas no projeto da Vercel.
  base_url: https://audiolab-site.vercel.app
  auth_endpoint: api/auth

# Isso faz o Decap usar o servidor local (decap-server) em vez do GitHub
# enquanto você estiver testando em localhost. Não afeta o site publicado.
local_backend: true

media_folder: "uploads"
public_folder: "/uploads"

# Projetos, pessoas, laboratório e pesquisa também são gerados pela
# planilha (npm run importar). Uma importação nova sobrescreve o que foi
# editado aqui nesses arquivos. Notícias só existem aqui.
collections:
  - name: "projetos"
    label: "Projetos"
    label_singular: "Projeto"
    folder: "content/projetos"
    create: true
    slug: "{{slug}}"
    format: "json"
    summary: "{{ordem}}. {{nome}}"
    sortable_fields: ["ordem", "nome"]
    fields:
      - { label: "Nome do projeto", name: "nome", widget: "string" }
      - { label: "Ordem", name: "ordem", widget: "number", value_type: "int", required: false, hint: "Posição nos cards e no menu. BadaUERJ, Ateliê do Podcast e Escola de Narradores vêm primeiro." }
      - { label: "Frase de resumo", name: "tagline", widget: "string", hint: "Até 25 palavras. Aparece no card e no topo da página." }
      - label: "Categoria"
        name: "tag"
        widget: "select"
        required: false
        options: ["Educação e ciência", "Jornalismo", "Cultura", "Esporte"]
      - { label: "O que é", name: "o_que_e", widget: "text", required: false, hint: "Primeiro parágrafo da seção Sobre, até 90 palavras." }
      - { label: "História e contexto", name: "historia_contexto", widget: "text", required: false, hint: "Segundo parágrafo da seção Sobre, até 90 palavras." }
      - { label: "Fale com o projeto", name: "fale_com_o_projeto", widget: "text", required: false, hint: "Chamada no fim da página, até 30 palavras. O botão abre o Instagram do projeto ou, sem Instagram, o e-mail." }
      - { label: "Coordenação", name: "coordenacao", widget: "string", required: false }
      - { label: "Ano de início", name: "ano_inicio", widget: "string", required: false, hint: "Ex.: 2018" }
      - { label: "E-mail do projeto", name: "email", widget: "string", required: false, hint: "Vazio usa o e-mail do laboratório." }
      - label: "Redes do projeto"
        name: "redes"
        widget: "object"
        required: false
        fields:
          - { label: "Instagram", name: "instagram", widget: "string", required: false }
          - { label: "Spotify", name: "spotify", widget: "string", required: false }
          - { label: "Amazon Music", name: "amazon_music", widget: "string", required: false }
          - { label: "YouTube", name: "youtube", widget: "string", required: false }
          - { label: "TikTok", name: "tiktok", widget: "string", required: false }
      - { label: "Vídeo em destaque (link do YouTube)", name: "video", widget: "string", required: false }
      - label: "Números"
        name: "estatisticas"
        widget: "list"
        required: false
        max: 3
        hint: "De 1 a 3 números de destaque (ex.: +500 mil visualizações)"
        fields:
          - { label: "Número", name: "numero", widget: "string" }
          - { label: "Rótulo", name: "rotulo", widget: "string" }
      - { label: "Logo do projeto", name: "logo", widget: "image", required: false, hint: "Vazio mostra a sigla no quadrado de cor do projeto." }
      - { label: "Foto de capa", name: "capa", widget: "image", required: false }
      - label: "Séries"
        name: "quadros"
        widget: "list"
        required: false
        hint: "Cada série vira um item expansível na página do projeto."
        fields:
          - { label: "Nome da série", name: "nome", widget: "string" }
          - { label: "Descrição", name: "descricao", widget: "text", required: false }
          - { label: "Link", name: "link", widget: "string", required: false }
          - { label: "Imagem", name: "imagem", widget: "image", required: false }
      - label: "Episódios e conteúdos"
        name: "conteudos"
        widget: "list"
        required: false
        fields:
          - { label: "Título", name: "titulo", widget: "string" }
          - { label: "Link", name: "link", widget: "string", required: false }
          - { label: "Data (dd/mm/aaaa)", name: "data", widget: "string", required: false, hint: "Ordena a lista do mais recente ao mais antigo. Sem data, o item fica depois dos datados." }

  - name: "pessoas"
    label: "Pessoas"
    label_singular: "Pessoa"
    folder: "content/pessoas"
    create: true
    slug: "{{slug}}"
    format: "json"
    summary: "{{nome}} · {{funcao}}"
    sortable_fields: ["ordem", "nome"]
    fields:
      - { label: "Nome", name: "nome", widget: "string" }
      - { label: "Ordem", name: "ordem", widget: "number", value_type: "int", required: false }
      - { label: "Função", name: "funcao", widget: "string", required: false, hint: "Uma só por pessoa." }
      - { label: "Foto 4:5", name: "foto", widget: "image", required: false }
      - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
      - label: "Projetos"
        name: "projetos"
        widget: "select"
        multiple: true
        required: false
        max: 4
        hint: "AudioLab é a equipe do laboratório. Todos os projetos vale para todos."
        options:
          - "AudioLab"
          - "Todos os projetos"
          - "JONAMI"
          - "BadaUERJ"
          - "Ateliê do Podcast"
          - "Escola de Narradores"
          - "A Gente da Ciência"
          - "Radioatividade"
          - "Mergulhando"
          - "UERJ no Ar"
          - "AudioLabGeo"
          - "Política nas Rampas"
      - { label: "Período", name: "periodo", widget: "string", required: false }

  - name: "noticias"
    label: "Notícias"
    label_singular: "Notícia"
    folder: "content/noticias"
    create: true
    slug: "{{slug}}"
    format: "json"
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - { label: "Subtítulo / resumo", name: "subtitulo", widget: "string", hint: "Aparece no destaque e na lista, uma ou duas linhas" }
      - { label: "Imagem de capa 16:9", name: "capa", widget: "image", required: false }
      - { label: "Data", name: "data", widget: "datetime", required: false }
      - label: "Tema"
        name: "tema"
        widget: "select"
        required: false
        options: ["Educação e ciência", "Jornalismo", "Cultura", "Esporte"]
        hint: "Usado no filtro por tema da página de notícias"
      - label: "Projeto relacionado"
        name: "projeto_relacionado"
        widget: "relation"
        collection: "projetos"
        search_fields: ["nome"]
        display_fields: ["nome"]
        value_field: "{{slug}}"
        required: false
        hint: "Usado no filtro por projeto e na página do projeto"
      - { label: "Link externo", name: "link", widget: "string", required: false, hint: "Se preenchido, o card abre esse link em vez da página interna da notícia" }
      - { label: "Corpo da notícia", name: "corpo", widget: "markdown", required: false }

  - name: "paginas"
    label: "Páginas"
    files:
      - name: "laboratorio"
        label: "Laboratório"
        file: "content/laboratorio.json"
        format: "json"
        fields:
          - { label: "Nome", name: "lab_nome", widget: "string" }
          - { label: "Nome completo", name: "lab_nome_completo", widget: "string" }
          - { label: "Desde", name: "lab_desde", widget: "string", required: false }
          - { label: "Assinatura", name: "lab_assinatura", widget: "string", required: false }
          - { label: "Descrição curta", name: "lab_descricao_curta", widget: "text", hint: "Abertura da página Sobre, até 60 palavras." }
          - { label: "Descrição completa", name: "lab_descricao_completa", widget: "text", required: false }
          - { label: "Metodologia", name: "lab_metodologia", widget: "text", required: false }
          - { label: "Unidade de Desenvolvimento Tecnológico", name: "lab_udt", widget: "text", required: false }
          - { label: "Avaliação", name: "lab_avaliacao", widget: "text", required: false }
          - { label: "RadioTube", name: "lab_radiotube", widget: "text", required: false }
          - { label: "E-mail", name: "lab_email", widget: "string", hint: "Usado no cabeçalho, no rodapé e nos projetos sem e-mail próprio." }
          - { label: "Link RadioTube", name: "lab_link_radiotube", widget: "string", required: false }
          - { label: "Instagram", name: "lab_link_instagram", widget: "string", required: false }
          - { label: "YouTube", name: "lab_link_youtube", widget: "string", required: false }
          - { label: "TikTok", name: "lab_link_tiktok", widget: "string", required: false }
          - { label: "LinkedIn", name: "lab_link_linkedin", widget: "string", required: false }
          - { label: "Facebook", name: "lab_link_facebook", widget: "string", required: false }
          - { label: "Site da FCS", name: "lab_link_fcs", widget: "string", required: false }
          - label: "Números do laboratório"
            name: "estatisticas"
            widget: "list"
            required: false
            max: 3
            fields:
              - { label: "Número", name: "numero", widget: "string" }
              - { label: "Rótulo", name: "rotulo", widget: "string" }
          - { label: "Premiações e reconhecimentos", name: "premios", widget: "list", required: false, hint: "Um prêmio por item" }
          - { label: "Revista: o que é", name: "revista_o_que_e", widget: "text", required: false }
          - { label: "Revista: história", name: "revista_historia", widget: "text", required: false }
          - { label: "Revista: onde ouvir", name: "revista_onde_ouvir", widget: "string", required: false }
          - { label: "Revista: link do Spotify", name: "revista_link_spotify", widget: "string", required: false }
          - label: "Revista: números"
            name: "revista_estatisticas"
            widget: "list"
            required: false
            max: 3
            fields:
              - { label: "Número", name: "numero", widget: "string" }
              - { label: "Rótulo", name: "rotulo", widget: "string" }
          - { label: "Destaque 1", name: "destaque_1", widget: "string", required: false }

      - name: "pesquisa"
        label: "Pesquisa e formação"
        file: "content/pesquisa.json"
        format: "json"
        fields:
          - { label: "Título da página", name: "pagina_titulo", widget: "string" }
          - { label: "Frase de apoio", name: "pagina_frase_apoio", widget: "text" }
          - { label: "JONAMI: sigla", name: "jonami_sigla", widget: "string" }
          - { label: "JONAMI: nome por extenso", name: "jonami_por_extenso", widget: "string" }
          - { label: "JONAMI: ano de formação", name: "jonami_ano_formacao", widget: "string", required: false }
          - { label: "JONAMI: liderança", name: "jonami_lideranca", widget: "string", required: false }
          - { label: "JONAMI: composição", name: "jonami_composicao", widget: "string", required: false }
          - { label: "JONAMI: Instagram", name: "jonami_link_instagram", widget: "string", required: false }
          - { label: "JONAMI: espelho no CNPq", name: "jonami_link_cnpq", widget: "string", required: false }
          - { label: "JONAMI: logo", name: "jonami_logo", widget: "image", required: false }
          - { label: "JONAMI: descrição curta", name: "jonami_descricao_curta", widget: "text" }
          - { label: "JONAMI: descrição completa", name: "jonami_descricao_completa", widget: "text", required: false }
          - label: "Conceitos"
            name: "conceitos"
            widget: "list"
            required: false
            max: 8
            fields:
              - { label: "Conceito", name: "conceito", widget: "string" }
              - { label: "Autores", name: "autores", widget: "string", required: false }
              - { label: "Definição", name: "definicao", widget: "text", required: false, hint: "Até 30 palavras." }
          - label: "Temas de pesquisa"
            name: "temas"
            widget: "list"
            required: false
            fields:
              - { label: "Eixo", name: "eixo", widget: "string", required: false, hint: "Vazio: o tema aparece em todos os eixos (tema do grupo)." }
              - { label: "Pessoa", name: "pessoa", widget: "string", required: false }
              - { label: "Nível", name: "nivel", widget: "string", required: false }
              - { label: "Tema", name: "tema", widget: "string" }
              - { label: "Descrição", name: "descricao", widget: "text", required: false }
          - { label: "Formação: título", name: "formacao_titulo", widget: "string" }
          - { label: "Formação: introdução", name: "formacao_intro", widget: "text", required: false }
          - label: "Oficinas e formação"
            name: "formacao"
            widget: "list"
            required: false
            fields:
              - { label: "Tipo", name: "tipo", widget: "select", options: ["Oficina", "Seminário", "Material"] }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Descrição", name: "descricao", widget: "text", required: false }
              - { label: "Foto", name: "foto", widget: "image", required: false }
              - { label: "Ano", name: "ano", widget: "string", required: false }
              - { label: "Link", name: "link", widget: "string", required: false, hint: "Seminário: playlist das mesas. Material: arquivo para baixar." }
          - label: "Em breve"
            name: "eventos"
            widget: "list"
            required: false
            hint: "O evento some do site sozinho depois da data."
            fields:
              - { label: "Nome do evento", name: "nome", widget: "string" }
              - { label: "Data (dd/mm/aaaa)", name: "data", widget: "string" }
              - { label: "Horário", name: "horario", widget: "string", required: false }
              - { label: "Local", name: "local", widget: "string", required: false }
              - { label: "Link", name: "link", widget: "string", required: false }

      - name: "sobre"
        label: "Sobre"
        file: "content/sobre.json"
        format: "json"
        fields:
          - { label: "História, parágrafo 1", name: "historia_1", widget: "text" }
          - { label: "História, parágrafo 2", name: "historia_2", widget: "text" }
          - { label: "Foto antiga", name: "foto_antiga", widget: "image", required: false }
          - { label: "Foto recente", name: "foto_recente", widget: "image", required: false }
          - { label: "Foto da UERJ", name: "foto_uerj", widget: "image", required: false }
          - label: "Valores (Queremos uma UERJ +)"
            name: "valores"
            widget: "list"
            required: false
            max: 3
            hint: "Até 3 valores, um por item"
          - label: "Fotos do carrossel"
            name: "carrossel_fotos"
            widget: "list"
            required: false
            hint: "Ao clicar na foto no site, a legenda aparece ao lado dela"
            fields:
              - { label: "Foto", name: "foto", widget: "image" }
              - { label: "Legenda", name: "legenda", widget: "text", required: false }

      - name: "cabecalho"
        label: "Cabeçalho"
        file: "content/cabecalho.json"
        format: "json"
        fields:
          - { label: "Texto do botão de newsletter", name: "newsletter_texto", widget: "string" }
          - { label: "Texto curto do botão (aparece no celular)", name: "newsletter_texto_curto", widget: "string" }

      - name: "rodape"
        label: "Rodapé"
        file: "content/rodape.json"
        format: "json"
        fields:
          - { label: "Endereço", name: "endereco", widget: "string" }
          - { label: "Cidade / UF", name: "cidade", widget: "string" }
